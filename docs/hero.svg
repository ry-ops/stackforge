<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">STACKFORGE: a guided homelab bootstrapper</title>
  <desc id="d">Run one script; it detects your environment and offers bare-metal k3s or k3d on Docker Desktop; it then installs each optional component phase by phase — Docker and Kubernetes, Traefik, Portainer, Prometheus and Grafana, Uptime Kuma, and a dashboard with a Go sidecar — ending in a live monitoring portal showing real cluster metrics.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#f58220"/><stop offset=".5" stop-color="#ffb648"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e8eef5; }
    .muted { fill:#8795a8; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes s1 { 0%,3.00% { opacity:0 } 7.00%,27.00% { opacity:1 } 30.00%,100% { opacity:0 } } .s1 { animation:s1 10.0s infinite; }
    @keyframes s2 { 0%,26.00% { opacity:0 } 30.00%,50.00% { opacity:1 } 53.00%,100% { opacity:0 } } .s2 { animation:s2 10.0s infinite; }
    @keyframes s3 { 0%,49.00% { opacity:0 } 53.00%,75.00% { opacity:1 } 78.00%,100% { opacity:0 } } .s3 { animation:s3 10.0s infinite; }
    @keyframes s4 { 0%,74.00% { opacity:0 } 78.00%,95.00% { opacity:1 } 98.00%,100% { opacity:0 } } .s4 { animation:s4 10.0s infinite; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} } .caret { animation: blink 1s steps(1) infinite; }
    @keyframes pf0 { 0%,49.00% { width:0 } 53.00%,100% { width:120px } } .pf0 { animation:pf0 10.0s infinite; }
    @keyframes pf1 { 0%,51.80% { width:0 } 55.80%,100% { width:120px } } .pf1 { animation:pf1 10.0s infinite; }
    @keyframes pf2 { 0%,54.60% { width:0 } 58.60%,100% { width:120px } } .pf2 { animation:pf2 10.0s infinite; }
    @keyframes pf3 { 0%,57.40% { width:0 } 61.40%,100% { width:120px } } .pf3 { animation:pf3 10.0s infinite; }
    @keyframes pf4 { 0%,60.20% { width:0 } 64.20%,100% { width:120px } } .pf4 { animation:pf4 10.0s infinite; }
    @keyframes pf5 { 0%,63.00% { width:0 } 67.00%,100% { width:120px } } .pf5 { animation:pf5 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; } rect[class^=pf]{width:120px} }
  </style>
  <rect width="960" height="400" rx="20" fill="#0c1016"/>
  <text x="40" y="54" font-size="30" font-weight="800" style="fill:url(#title)">STACKFORGE</text>
  <text x="42" y="82" font-size="15" class="muted">A guided homelab bootstrapper — one script, real monitoring, choose your adventure.</text>

  <!-- terminal -->
  <rect x="40" y="110" width="400" height="250" rx="12" fill="#0a0e14" stroke="#222c38"/>
  <circle cx="62" cy="130" r="5" fill="#ff5f56"/><circle cx="80" cy="130" r="5" fill="#ffbd2e"/><circle cx="98" cy="130" r="5" fill="#27c93f"/>
  <text x="60" y="166" font-size="12.5" class="mono"><tspan style="fill:#7ee6a0">$</tspan> bash stackforge.sh</text>
  <g class="s1"><text x="60" y="194" font-size="11.5" class="mono muted">Detected: macOS · Docker Desktop</text>
    <text x="60" y="214" font-size="11.5" class="mono">Choose your adventure:</text>
    <text x="78" y="234" font-size="11.5" class="mono muted">1) bare-metal k3s</text>
    <text x="78" y="254" font-size="11.5" class="mono" style="fill:#ffb648">2) k3d on Docker ◂</text></g>
  <g class="s2"><text x="60" y="284" font-size="11.5" class="mono muted">Pick components — each is optional.</text>
    <text x="60" y="304" font-size="11.5" class="mono" style="fill:#2dd4bf">[x] traefik [x] grafana [x] kuma …</text></g>
  <g class="s4"><text x="60" y="334" font-size="11.5" class="mono" style="fill:#7ee6a0">✓ Cluster ready — dashboard :30080</text></g>
  <text x="60" y="334" font-size="12.5" class="mono s2" style="fill:#7ee6a0">installing… <tspan class="caret">▋</tspan></text>

  <!-- phases filling -->
  <text x="470" y="134" font-size="11" font-weight="700" class="muted">INSTALLS PHASE BY PHASE — IDEMPOTENT, RE-RUNNABLE</text>
  <text x="470" y="161" font-size="11" class="muted">Docker + k3s/k3d</text><rect x="660" y="152" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf0" x="660" y="152" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="161" font-size="11" style="fill:#7ee6a0">✓</text><text x="470" y="191" font-size="11" class="muted">Traefik ingress</text><rect x="660" y="182" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf1" x="660" y="182" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="191" font-size="11" style="fill:#7ee6a0">✓</text><text x="470" y="221" font-size="11" class="muted">Portainer</text><rect x="660" y="212" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf2" x="660" y="212" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="221" font-size="11" style="fill:#7ee6a0">✓</text><text x="470" y="251" font-size="11" class="muted">Prometheus+Grafana</text><rect x="660" y="242" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf3" x="660" y="242" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="251" font-size="11" style="fill:#7ee6a0">✓</text><text x="470" y="281" font-size="11" class="muted">Uptime Kuma</text><rect x="660" y="272" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf4" x="660" y="272" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="281" font-size="11" style="fill:#7ee6a0">✓</text><text x="470" y="311" font-size="11" class="muted">Dashboard + sf-api</text><rect x="660" y="302" width="120" height="10" rx="5" fill="#1b2430"/><rect class="pf5" x="660" y="302" height="10" rx="5" fill="#f58220"/><text class="s3" x="790" y="311" font-size="11" style="fill:#7ee6a0">✓</text>
</svg>
